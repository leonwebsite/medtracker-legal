<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>藥安心｜按時吃藥，家人安心</title>
<meta name="description" content="藥安心：時間到提醒吃藥，吃完點一下確認；病人同意後，家人也能放心。iPhone 適用。">
<meta property="og:title" content="藥安心｜按時吃藥，家人安心">
<meta property="og:description" content="時間到提醒吃藥，吃完點一下確認；病人同意後，家人也能放心。iPhone 適用。">
<style>
  :root{--navy:#0B2A44;--blue:#155A96;--lb:#AEDBF3;--bg:#F4F9FC;--card:#FFFFFF;--muted:#4E667E}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
  main{max-width:480px;margin:0 auto;padding:40px 20px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(11,42,68,.15)}
  h1{font-size:34px;margin:20px 0 4px;letter-spacing:2px}
  .tag{font-size:20px;font-weight:700;color:var(--blue);margin:0 0 24px}
  ul{list-style:none;padding:0;margin:0 0 28px;width:100%;text-align:left;display:flex;flex-direction:column;gap:12px}
  li{background:var(--card);border-radius:16px;padding:16px 14px;font-size:16px;display:flex;gap:10px;align-items:flex-start}
  li b{color:var(--blue)}
  li>span:last-child{flex:1;text-align:left;letter-spacing:1.2px}
  .dot{flex:none;width:28px;height:28px;border-radius:50%;background:var(--lb);color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;margin-top:1px}
  .btn{display:block;width:100%;background:var(--navy);color:#fff;text-decoration:none;font-size:20px;font-weight:800;padding:18px;border-radius:999px;box-shadow:0 8px 20px rgba(11,42,68,.25)}
  .btn:active{transform:scale(.98)}
  .sub{font-size:15px;color:var(--muted);margin:12px 0 0}
  .fine{font-size:13px;color:#6B8094}
  .hint{margin-top:24px;background:#E7F3FB;border-radius:14px;padding:14px 16px;font-size:15px;color:var(--navy);text-align:left;width:100%}
  footer{margin-top:28px;font-size:13px;color:var(--muted)}
  footer a{color:var(--blue)}
  @media (max-width:385px){main{padding-left:16px;padding-right:16px}li{padding:14px 12px}li>span:last-child{letter-spacing:1px}}
</style>
</head>
